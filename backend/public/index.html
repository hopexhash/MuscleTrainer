<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuscleTrainer — Video Admin</title>
<style>
  :root {
    --bg:#05070A; --surf:#0C1118; --card:#111821; --accent:#1687FF; --bright:#39A7FF;
    --t1:#FFF; --t2:#8D98A8; --brd:rgba(255,255,255,.07); --ok:#33C778; --bad:#FF5252;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--t1); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:880px; margin:0 auto; padding:32px 20px 80px; }
  h1 { font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .sub { color:var(--t2); font-size:13px; margin:4px 0 20px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  input[type=search], input[type=password] {
    background:var(--surf); border:1px solid var(--brd); color:var(--t1);
    border-radius:12px; padding:10px 14px; font-size:14px; flex:1; min-width:180px;
  }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .hint { font-size:12px; color:var(--t2); margin:-10px 0 18px; }
  .group-h {
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent); margin:26px 0 8px;
  }
  .row {
    display:flex; align-items:center; gap:14px; background:var(--card);
    border:1px solid var(--brd); border-radius:14px; padding:12px 14px; margin-bottom:8px;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--t2); opacity:.4; flex-shrink:0; }
  .dot.on { background:var(--ok); opacity:1; }
  .name { font-size:14px; font-weight:600; }
  .meta { font-size:11px; color:var(--t2); margin-top:1px; }
  .row video { width:96px; height:54px; object-fit:cover; border-radius:8px; background:var(--surf); }
  .spacer { flex:1; }
  .btn {
    background:var(--accent); color:#fff; border:0; border-radius:10px;
    font-size:12.5px; font-weight:600; padding:9px 14px; cursor:pointer;
  }
  .btn.ghost { background:var(--surf); color:var(--t2); border:1px solid var(--brd); }
  .btn:hover { filter:brightness(1.1); }
  .btn:disabled { opacity:.5; cursor:default; }
  .file-hidden { display:none; }
  #toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--card); border:1px solid var(--brd); border-radius:12px;
    padding:12px 18px; font-size:13px; display:none; max-width:90vw;
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  #toast.ok { border-color:rgba(51,199,120,.5); }
  #toast.bad { border-color:rgba(255,82,82,.5); }
  .count-pill {
    font-size:11px; font-weight:700; color:var(--bright);
    background:rgba(22,135,255,.12); border-radius:999px; padding:4px 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>MuscleTrainer video admin</h1>
  <p class="sub">Upload a short looping demo video for each exercise. The app picks them up automatically. <span class="count-pill" id="stats">…</span></p>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search exercises…">
    <input type="password" id="token" placeholder="Admin token" autocomplete="off">
  </div>
  <p class="hint">The token is whatever ADMIN_TOKEN was set to when starting the server (default: muscle-admin). It's stored only in this browser.</p>

  <div id="list"></div>
</div>
<div id="toast"></div>

<script>
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const tokenEl = document.getElementById('token');
const toastEl = document.getElementById('toast');
let exercises = [];

tokenEl.value = localStorage.getItem('mt-admin-token') || '';
tokenEl.addEventListener('input', () => localStorage.setItem('mt-admin-token', tokenEl.value));

function toast(msg, ok) {
  toastEl.textContent = msg;
  toastEl.className = ok ? 'ok' : 'bad';
  toastEl.style.display = 'block';
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.style.display = 'none', 3500);
}

async function load() {
  try {
    const res = await fetch('/api/exercises');
    exercises = (await res.json()).exercises;
    render();
  } catch (e) {
    toast('Could not load the exercise list.', false);
  }
}

function render() {
  const q = qEl.value.trim().toLowerCase();
  const filtered = exercises.filter(e =>
    !q || e.name.toLowerCase().includes(q) || e.muscle.toLowerCase().includes(q));
  const withVideo = exercises.filter(e => e.hasVideo).length;
  document.getElementById('stats').textContent = `${withVideo} / ${exercises.length} videos uploaded`;

  const groups = {};
  for (const e of filtered) (groups[e.muscle] ||= []).push(e);

  listEl.innerHTML = Object.keys(groups).sort().map(muscle => `
    <div class="group-h">${muscle}</div>
    ${groups[muscle].map(e => `
      <div class="row" data-id="${e.id}">
        <span class="dot ${e.hasVideo ? 'on' : ''}"></span>
        ${e.hasVideo ? `<video src="${e.videoURL}" loop muted playsinline onmouseenter="this.play()" onmouseleave="this.pause()"></video>` : ''}
        <div>
          <div class="name">${e.name}</div>
          <div class="meta">${e.id}${e.hasVideo ? ' · video live' : ' · no video yet'}</div>
        </div>
        <div class="spacer"></div>
        <input class="file-hidden" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.m4v,.webm"
               onchange="uploadVideo('${e.id}', this)">
        <button class="btn" onclick="this.previousElementSibling.click()">${e.hasVideo ? 'Replace' : 'Upload'}</button>
        ${e.hasVideo ? `<button class="btn ghost" onclick="removeVideo('${e.id}')">Delete</button>` : ''}
      </div>`).join('')}
  `).join('');
}

async function uploadVideo(id, input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const row = document.querySelector(`[data-id="${id}"] .btn`);
  if (row) { row.disabled = true; row.textContent = 'Uploading…'; }
  const form = new FormData();
  form.append('video', file);
  try {
    const res = await fetch(`/api/videos/${id}`, {
      method: 'POST',
      headers: { 'x-admin-token': tokenEl.value },
      body: form,
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Upload failed.');
    toast(`Uploaded video for ${id}.`, true);
  } catch (e) {
    toast(e.message, false);
  }
  load();
}

async function removeVideo(id) {
  if (!confirm(`Delete the video for ${id}?`)) return;
  try {
    const res = await fetch(`/api/videos/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-token': tokenEl.value },
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Delete failed.');
    toast(`Deleted video for ${id}.`, true);
  } catch (e) {
    toast(e.message, false);
  }
  load();
}

qEl.addEventListener('input', render);
load();
</script>
</body>
</html>
